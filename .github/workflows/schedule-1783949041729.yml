name: "Messenger Reminder: Test 7"

on:
  workflow_dispatch:
    inputs:
      dynamic_message:
        description: 'The message to send'
        required: true
        default: ''
      reminder_tasks:
        description: 'JSON string of tasks to execute for targeted reminders'
        required: false
        default: '[]'

jobs:
  deploy-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - name: Execute Script
        env:
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
          CHAT_URL: 'https://www.facebook.com/messages/t/868907569173985/'
          CHAT_MESSAGE: |
            ${{ github.event.inputs.dynamic_message }}
          REMINDER_TASKS: |
            ${{ github.event.inputs.reminder_tasks }}
          FB_E2EE_PIN: ${{ secrets.FB_E2EE_PIN }}
        run: node index.js
